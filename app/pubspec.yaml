name: dpos
description: "DPOS — Indonesian mobile POS (phone + tablet)."
publish_to: "none"
version: 0.5.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State
  flutter_riverpod: ^2.6.1

  # Networking
  dio: ^5.7.0

  # Local cache + offline queue
  drift: ^2.21.0
  drift_flutter: ^0.2.4

  # Utils
  intl: ^0.20.2
  uuid: ^4.5.1
  qr_flutter: ^4.1.0
  connectivity_plus: ^6.1.0
  shared_preferences: ^2.3.2

  # Brand marks for payment methods ship as SVG (crisp at any density).
  flutter_svg: ^2.0.10+1

  # Spoken payment confirmation (Indonesian TTS)
  flutter_tts: ^4.2.0

  # Grocery barcode-scanner POS mode + Bluetooth thermal printing (DPOSP)
  mobile_scanner: ^5.2.3
  print_bluetooth_thermal: ^1.1.1
  esc_pos_utils_plus: ^2.0.4
  # Speech-to-text (Bahasa Indonesia), ANDROID ONLY for now — see lib/features/stt/.
  speech_to_text: ^7.4.0

  # Keep BELOW 12.0.0. permission_handler 13.x resolves permission_handler_android 14.1.0, whose
  # build.gradle.kts uses the newer Kotlin DSL (kotlin { compilerOptions { … } }) and fails to
  # resolve against this project's Kotlin 2.2.20 / AGP 8.11.1 with android.newDsl=false.
  permission_handler: ^11.3.1

  # App version for the Settings screen
  package_info_plus: ^8.1.0

  # Brand wordmark font (Quicksand)
  google_fonts: ^6.2.1
  image_picker: ^1.2.3
  # Resizing is done here rather than inside image_picker so the wait can be attributed:
  # pickImage(maxWidth:) hides the downscale inside the same call as the user browsing.
  flutter_image_compress: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.21.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/images/payments/
    # Bundled Quicksand Bold so the DIKASIR wordmark renders offline (google_fonts
    # uses this local file instead of fetching at runtime).
    - google_fonts/
