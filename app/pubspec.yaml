name: dpos
description: "DPOS — Indonesian mobile POS (phone + tablet)."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State
  flutter_riverpod: ^2.6.1

  # Networking
  dio: ^5.7.0

  # Local cache + offline queue
  drift: ^2.21.0
  drift_flutter: ^0.2.4

  # Utils
  intl: ^0.20.2
  uuid: ^4.5.1
  qr_flutter: ^4.1.0
  connectivity_plus: ^6.1.0
  shared_preferences: ^2.3.2

  # Spoken payment confirmation (Indonesian TTS)
  flutter_tts: ^4.2.0

  # Grocery barcode-scanner POS mode + Bluetooth thermal printing (DPOSP)
  mobile_scanner: ^5.2.3
  print_bluetooth_thermal: ^1.1.1
  esc_pos_utils_plus: ^2.0.4
  permission_handler: ^11.3.1
  audioplayers: ^6.1.0 # scan beep

  # App version for the Settings screen
  package_info_plus: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.21.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/sounds/
